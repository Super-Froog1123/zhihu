    <div class="app-shell">

        <header class="workspace-heading">

          <div class="scene-controls">
            <button id="toggle-animation" aria-pressed="false">Ⅱ <span>暂停动画</span></button>
            <span class="control-divider"></span>

          </div>
          <span class="footer-caption">知乎 · 知识星球</span>

      <aside id="status-panel" class="status-panel" aria-label="演示状态统计"></aside>
    </div>
